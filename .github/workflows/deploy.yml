name: Deploy site to GitHub Pages

# Publishes sites/crave-kangen/ as the root of cravekangen.com
on:
  push:
    branches:
      - claude/install-frontend-design-skill-2vlxhi
      - main
    paths:
      - "sites/crave-kangen/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/crave-kangen

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
